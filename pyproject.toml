[project]
name = "batch-shuffling-regularization"
version = "0.1.0"
description = "Does shuffling the training data act as a regularizer? MNIST MLP experiment."
readme = "README.md"
authors = [
    { name = "Darian Dieck", email = "dari.dieck@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
]
